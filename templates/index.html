<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>MTR Track & Train Monitor System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased selection:bg-red-600 selection:text-white">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 顶栏与板块切换菜单 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-gray-900/80 backdrop-blur p-5 rounded-2xl shadow-xl border border-gray-800 gap-4">
            <div>
                <h1 id="main-title" class="text-2xl font-black tracking-wider text-red-500 flex items-center gap-2 transition-colors duration-300">
                    <span id="title-dot" class="inline-block w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    <span id="title-text">港铁荃湾线实时月台与运行图</span>
                </h1>
                <p class="text-xs text-gray-400 mt-1">MTR Line Platform & Track Monitor System</p>
            </div>

            <!-- 板块切换菜单按钮 -->
            <div class="flex items-center gap-2 bg-gray-950 p-1.5 rounded-xl border border-gray-800">
                <button onclick="switchLine('TWL')" id="btn-twl" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-red-600 text-white shadow">荃湾线 (TWL)</button>
                <button onclick="switchLine('KTL')" id="btn-ktl" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white">观塘线 (KTL)</button>
                <button onclick="switchLine('ISL')" id="btn-isl" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white">港岛线 (ISL)</button>
            </div>

            <div id="connection-status" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800/50 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>实时同步中</span>
            </div>
        </header>

        <!-- 运行图主面板 -->
        <div class="bg-gray-900/90 rounded-2xl p-6 shadow-2xl border border-gray-800">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-gray-800 text-xs text-gray-400 font-mono">
                <div id="round-counter">轮次: #0</div>
                <div class="flex items-center gap-4">
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span> 全程车</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 区间车</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 无法跟踪</span>
                </div>
            </div>

            <!-- 车站与月台拓扑图容器 -->
            <div id="topology-container" class="space-y-1">
                <div class="text-center text-gray-500 py-12">正在加载月台数据与轨道拓扑...</div>
            </div>
        </div>
    </div>

    <script>
        let currentActiveLine = 'TWL';

        async function switchLine(line) {
            currentActiveLine = line;
            
            document.getElementById('topology-container').innerHTML = `
                <div class="text-center text-amber-400 py-12 animate-pulse font-mono text-sm">
                    正在获取 ${line} 线最新数据...
                </div>
            `;
            document.getElementById('round-counter').innerText = `线路: ${line} | 轮次: #-`;

            const isTwl = (line === 'TWL');
            const isKtl = (line === 'KTL');
            const isIsl = (line === 'ISL');

            document.getElementById('btn-twl').className = isTwl ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-red-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white';
            document.getElementById('btn-ktl').className = isKtl ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-emerald-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white';
            document.getElementById('btn-isl').className = isIsl ? 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow' : 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-gray-400 hover:text-white';

            const titleEl = document.getElementById('main-title');
            const dotEl = document.getElementById('title-dot');
            const textEl = document.getElementById('title-text');

            if (isTwl) {
                titleEl.className = "text-2xl font-black tracking-wider text-red-500 flex items-center gap-2 transition-colors duration-300";
                dotEl.className = "inline-block w-3 h-3 rounded-full bg-red-500 animate-pulse";
                textEl.innerText = "港铁荃湾线实时月台与运行图";
            } else if (isKtl) {
                titleEl.className = "text-2xl font-black tracking-wider text-emerald-500 flex items-center gap-2 transition-colors duration-300";
                dotEl.className = "inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                textEl.innerText = "港铁观塘线实时月台与运行图";
            } else {
                titleEl.className = "text-2xl font-black tracking-wider text-blue-500 flex items-center gap-2 transition-colors duration-300";
                dotEl.className = "inline-block w-3 h-3 rounded-full bg-blue-500 animate-pulse";
                textEl.innerText = "港铁港岛线实时月台与运行图";
            }

            await fetch('/api/switch_line', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ line: line })
            });

            fetchTrainData();
        }

        async function fetchTrainData() {
            try {
                const response = await fetch(`/api/status?line=${currentActiveLine}`);
                const result = await response.json();
                
                if (result.status) {
                    if (result.fresh && result.data) {
                        renderTopology(result.line, result.data);
                        document.getElementById('connection-status').className = "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800/50 flex items-center gap-1.5";
                        document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span><span>实时同步中</span>';
                    } else {
                        document.getElementById('connection-status').className = "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-amber-950 text-amber-400 border border-amber-800/50 flex items-center gap-1.5";
                        document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400"></span><span>正在抓取</span>';
                    }
                }
            } catch (error) {
                console.error("获取数据失败:", error);
            }
        }

        // 平台徽章样式逻辑
        function getPlatformBadgeStyle(platNum, staCode, arrivedPlats, greenPlats, isArrived) {
            if ((staCode === "TSW" && platNum === "1") || (staCode === "TIK" && platNum === "1") || (staCode === "KET" && platNum === "2")) {
                return 'bg-blue-600 text-white border-blue-500 shadow-lg shadow-blue-900/50';
            }
            if (greenPlats.includes(platNum)) {
                return 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/50 border-emerald-500 animate-pulse';
            }
            if (arrivedPlats.includes(platNum) || isArrived) {
                return 'bg-red-600 text-white shadow-lg shadow-red-900/50 border-red-500 animate-pulse';
            }
            return 'bg-gray-800 text-gray-400 border-gray-700/60';
        }

        function getRailStyle(hasTrain, isGreen, isBlue) {
            if (isBlue) return 'bg-blue-600';
            if (hasTrain && isGreen) return 'bg-emerald-500 animate-pulse';
            if (hasTrain) return 'bg-red-500 animate-pulse';
            return 'bg-gray-800';
        }

        function renderTopology(line, data) {
            const container = document.getElementById('topology-container');
            const stations = data.stations;
            const arrivedStatus = data.arrived_status;
            const segmentQueues = data.segment_queues || {};
            
            document.getElementById('round-counter').innerText = `线路: ${line} | 轮次: #${data.current_round || 0}`;

            let html = '';

            // 动态选择站名颜色：TWL 红色，KTL 绿色，ISL 蓝色
            let stationNameColorClass = 'text-red-500';
            if (line === 'KTL') stationNameColorClass = 'text-emerald-500';
            if (line === 'ISL') stationNameColorClass = 'text-blue-500';

            stations.forEach((staCode, index) => {
                const staInfo = arrivedStatus[staCode] || { UP: false, DOWN: false, plats: [], green_plats: [] };
                const greenPlats = staInfo.green_plats || [];
                const arrivedPlats = staInfo.plats || [];

                if (line === 'TWL') {
                    let upPlatNum = (staInfo.up_plat !== undefined) ? staInfo.up_plat : '-';
                    let downPlatNum = (staInfo.down_plat !== undefined) ? staInfo.down_plat : '-';

                    const upIsArrived = arrivedPlats.includes(upPlatNum) || (staCode !== "CEN" && staInfo.UP);
                    const downIsArrived = arrivedPlats.includes(downPlatNum) || (staCode !== "CEN" && staInfo.DOWN);

                    const upBadgeClass = getPlatformBadgeStyle(upPlatNum, staCode, arrivedPlats, greenPlats, upIsArrived);
                    const downBadgeClass = getPlatformBadgeStyle(downPlatNum, staCode, arrivedPlats, greenPlats, downIsArrived);

                    html += `
                        <div class="flex items-center justify-between bg-gray-950/70 px-6 py-3 rounded-xl border border-gray-800/80">
                            <div class="w-36 flex items-center">
                                <div class="w-full px-3 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center justify-between ${upBadgeClass}">
                                    <span class="opacity-70">PF</span>
                                    <span>${upPlatNum}</span>
                                    <span>${(staCode === "TSW" && upPlatNum === "1") ? '○' : (upIsArrived || greenPlats.includes(upPlatNum) ? '●' : '○')}</span>
                                </div>
                            </div>
                            <div class="text-center font-mono font-black text-xl ${stationNameColorClass}">${staCode}</div>
                            <div class="w-36 flex items-center justify-end">
                                <div class="w-full px-3 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center justify-between ${downBadgeClass}">
                                    <span>${(staCode === "TSW" && downPlatNum === "1") ? '○' : (downIsArrived || greenPlats.includes(downPlatNum) ? '●' : '○')}</span>
                                    <span>PF</span>
                                    <span>${downPlatNum}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    if (index < stations.length - 1) {
                        const nextCode = stations[index + 1];
                        const downQueue = segmentQueues[`TWL-DOWN-${staCode}->${nextCode}`] || [];
                        const upQueue = segmentQueues[`TWL-UP-${nextCode}->${staCode}`] || [];
                        
                        const downHasTrain = downQueue.length > 0;
                        const upHasTrain = upQueue.length > 0;
                        const downIsGreen = downQueue.some(t => t.dest && !["CEN", "TSW"].includes(t.dest));
                        const upIsGreen = upQueue.some(t => t.dest && !["CEN", "TSW"].includes(t.dest));
                        
                        const isDownBlue = (nextCode === 'TSW');

                        const upRailColor = getRailStyle(upHasTrain, upIsGreen, false);
                        const downRailColor = getRailStyle(downHasTrain, downIsGreen, isDownBlue);

                        html += `<div class="flex justify-between items-center px-10 py-0.5"><div class="w-1 h-5 rounded ${upRailColor}"></div><div class="flex-1 border-t border-dashed border-gray-800 mx-6"></div><div class="w-1 h-5 rounded ${downRailColor}"></div></div>`;
                    }

                } else if (line === 'KTL') {
                    let upPlatNum = (staInfo.up_plat !== undefined) ? staInfo.up_plat : '-';
                    let downPlatNum = (staInfo.down_plat !== undefined) ? staInfo.down_plat : '-';

                    const upIsArrived = staInfo.UP || arrivedPlats.includes(upPlatNum);
                    const downIsArrived = staInfo.DOWN || arrivedPlats.includes(downPlatNum);

                    let upBadgeClass = getPlatformBadgeStyle(upPlatNum, staCode, arrivedPlats, greenPlats, upIsArrived);
                    let downBadgeClass = getPlatformBadgeStyle(downPlatNum, staCode, arrivedPlats, greenPlats, downIsArrived);

                    let middleHtml = `<div class="text-center font-mono font-black text-xl ${stationNameColorClass}">${staCode}</div>`;
                    if (staCode === "CHH") {
                        let mid2Plat = (staInfo.mid2_plat !== undefined) ? staInfo.mid2_plat : '-';
                        let mid3Plat = (staInfo.mid3_plat !== undefined) ? staInfo.mid3_plat : '-';
                        const midBadgeClass2 = getPlatformBadgeStyle(mid2Plat, staCode, arrivedPlats, greenPlats, arrivedPlats.includes(mid2Plat));
                        const midBadgeClass3 = getPlatformBadgeStyle(mid3Plat, staCode, arrivedPlats, greenPlats, arrivedPlats.includes(mid3Plat));

                        middleHtml = `
                            <div class="flex items-center justify-center gap-3">
                                <div class="px-2.5 py-1 rounded-md text-[10px] font-mono font-bold border flex items-center gap-1.5 ${midBadgeClass2}">
                                    <span class="opacity-70">PF</span><span>${mid2Plat}</span><span>${arrivedPlats.includes(mid2Plat) || greenPlats.includes(mid2Plat) ? '●' : '○'}</span>
                                </div>
                                <span class="font-mono font-black text-xl ${stationNameColorClass} px-2">${staCode}</span>
                                <div class="px-2.5 py-1 rounded-md text-[10px] font-mono font-bold border flex items-center gap-1.5 ${midBadgeClass3}">
                                    <span>${arrivedPlats.includes(mid3Plat) || greenPlats.includes(mid3Plat) ? '●' : '○'}</span><span class="opacity-70">PF</span><span>${mid3Plat}</span>
                                </div>
                            </div>
                        `;
                    }

                    html += `
                        <div class="flex items-center justify-between bg-gray-950/70 px-6 py-3 rounded-xl border border-gray-800/80">
                            <div class="w-36 flex items-center">
                                <div class="w-full px-3 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center justify-between ${upBadgeClass}">
                                    <span class="opacity-70">PF</span><span>${upPlatNum}</span><span>${(staCode === "TIK" && upPlatNum === "1") ? '○' : (upIsArrived || greenPlats.includes(upPlatNum) ? '●' : '○')}</span>
                                </div>
                            </div>
                            <div class="flex-1 text-center">${middleHtml}</div>
                            <div class="w-36 flex items-center justify-end">
                                <div class="w-full px-3 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center justify-between ${downBadgeClass}">
                                    <span>${(staCode === "TIK" && downPlatNum === "1") ? '○' : (downIsArrived || greenPlats.includes(downPlatNum) ? '●' : '○')}</span><span>PF</span><span>${downPlatNum}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    if (index < stations.length - 1) {
                        const nextCode = stations[index + 1];
                        const downQueue = segmentQueues[`KTL-DOWN-${staCode}->${nextCode}`] || [];
                        const upQueue = segmentQueues[`KTL-UP-${nextCode}->${staCode}`] || [];
                        
                        const downHasTrain = downQueue.length > 0;
                        const upHasTrain = upQueue.length > 0;
                        const downIsGreen = downQueue.some(t => t.dest && !["WHA", "TIK"].includes(t.dest));
                        const upIsGreen = upQueue.some(t => t.dest && !["WHA", "TIK"].includes(t.dest));
                        
                        const isDownBlue = (nextCode === 'TIK' || staCode === 'TIK');

                        const upRailColor = getRailStyle(upHasTrain, upIsGreen, false);
                        const downRailColor = getRailStyle(downHasTrain, downIsGreen, isDownBlue);

                        html += `<div class="flex justify-between items-center px-10 py-0.5"><div class="w-1 h-5 rounded ${upRailColor}"></div><div class="flex-1 border-t border-dashed border-gray-800 mx-6"></div><div class="w-1 h-5 rounded ${downRailColor}"></div></div>`;
                    }

                } else if (line === 'ISL') {
                    // 读取后端发来的具体月台编号 (UP侧固定为2号，DOWN侧固定为1号)
                    let upPlatNum = (staInfo.up_plat !== undefined) ? staInfo.up_plat : '-';
                    let downPlatNum = (staInfo.down_plat !== undefined) ? staInfo.down_plat : '-';

                    // 💡 精准到具体月台匹配判断：
                    const upIsArrived = (staCode === "KET") ? false : (arrivedPlats.includes(upPlatNum) || staInfo.UP);
                    const downIsArrived = arrivedPlats.includes(downPlatNum) || staInfo.DOWN;

                    let upBadgeClass = getPlatformBadgeStyle(upPlatNum, staCode, arrivedPlats, greenPlats, upIsArrived);
                    let downBadgeClass = getPlatformBadgeStyle(downPlatNum, staCode, arrivedPlats, greenPlats, downIsArrived);

                    html += `
                        <div class="flex items-center justify-between bg-gray-950/70 px-6 py-3 rounded-xl border border-gray-800/80">
                            <div class="w-36 flex items-center">
                                <div class="w-full px-3 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center justify-between ${upBadgeClass}">
                                    <span class="opacity-70">PF</span><span>${upPlatNum}</span><span>${staCode === "KET" ? '○' : (upIsArrived || greenPlats.includes(upPlatNum) ? '●' : '○')}</span>
                                </div>
                            </div>
                            <div class="text-center font-mono font-black text-xl ${stationNameColorClass}">${staCode}</div>
                            <div class="w-36 flex items-center justify-end">
                                <div class="w-full px-3 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center justify-between ${downBadgeClass}">
                                    <span>${downIsArrived || greenPlats.includes(downPlatNum) ? '●' : '○'}</span><span class="opacity-70">PF</span><span>${downPlatNum}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    if (index < stations.length - 1) {
                        const nextCode = stations[index + 1];
                        const downQueue = segmentQueues[`ISL-DOWN-${staCode}->${nextCode}`] || [];
                        const upQueue = segmentQueues[`ISL-UP-${nextCode}->${staCode}`] || [];
                        
                        const downHasTrain = downQueue.length > 0;
                        const upHasTrain = upQueue.length > 0;
                        const downIsGreen = downQueue.some(t => t.dest && !["KET", "CHW"].includes(t.dest));
                        const upIsGreen = upQueue.some(t => t.dest && !["KET", "CHW"].includes(t.dest));

                        const isUpBlue = (staCode === 'KET' && nextCode === 'HKU');

                        const upRailColor = getRailStyle(upHasTrain, upIsGreen, isUpBlue);
                        const downRailColor = getRailStyle(downHasTrain, downIsGreen, false);

                        html += `<div class="flex justify-between items-center px-10 py-0.5"><div class="w-1 h-5 rounded ${upRailColor}"></div><div class="flex-1 border-t border-dashed border-gray-800 mx-6"></div><div class="w-1 h-5 rounded ${downRailColor}"></div></div>`;
                    }
                }
            });

            container.innerHTML = html;
        }

        switchLine('TWL');
        setInterval(fetchTrainData, 10000);
    </script>
</body>
</html>
