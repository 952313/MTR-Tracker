<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>MTR Tsuen Wan Line Track & Train Monitor</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased selection:bg-red-600 selection:text-white">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 顶栏 -->
        <header class="flex justify-between items-center mb-8 bg-gray-900/80 backdrop-blur p-5 rounded-2xl shadow-xl border border-gray-800">
            <div>
                <h1 class="text-2xl font-black tracking-wider text-red-500 flex items-center gap-2">
                    <span class="inline-block w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                    港铁荃湾线实时月台与运行图
                </h1>
                <p class="text-xs text-gray-400 mt-1">MTR Tsuen Wan Line Platform & Track Monitor System</p>
            </div>
            <div id="connection-status" class="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800/50 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>实时同步中</span>
            </div>
        </header>

        <!-- 运行图主面板 -->
        <div class="bg-gray-900/90 rounded-2xl p-6 shadow-2xl border border-gray-800">
            <div class="flex justify-between items-center mb-6 pb-3 border-b border-gray-800 text-xs text-gray-400 font-mono">
                <div id="round-counter">轮次: #0</div>
                <div class="flex items-center gap-4">
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span> 列车停靠 (月台占用)</span>
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 运行 / 过海绿灯</span>
                </div>
            </div>

            <!-- 车站与月台拓扑图容器 -->
            <div id="topology-container" class="space-y-1">
                <div class="text-center text-gray-500 py-12">正在加载月台数据与轨道拓扑...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchTrainData() {
            try {
                const response = await fetch('/api/twl_status');
                const result = await response.json();
                
                if (result.status) {
                    renderTopology(result.data);
                    document.getElementById('connection-status').className = "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800/50 flex items-center gap-1.5";
                    document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span><span>实时同步中</span>';
                } else {
                    throw new Error("API 返回状态错误");
                }
            } catch (error) {
                console.error("获取数据失败:", error);
                document.getElementById('connection-status').className = "px-3.5 py-1.5 rounded-full text-xs font-semibold bg-rose-950 text-rose-400 border border-rose-800/50 flex items-center gap-1.5";
                document.getElementById('connection-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>连接异常</span>';
            }
        }

        function renderTopology(data) {
            const container = document.getElementById('topology-container');
            const stations = data.stations;
            const arrivedStatus = data.arrived_status;
            const segmentQueues = data.segment_queues || {};
            
            document.getElementById('round-counter').innerText = `轮次统计: #${data.current_round}`;

            let html = '';

            stations.forEach((staCode, index) => {
                const staInfo = arrivedStatus[staCode] || { UP: false, DOWN: false, plats: [] };
                const greenPlats = staInfo.green_plats || [];
                const arrivedPlats = staInfo.plats || [];

                // 针对不同车站分配对应的月台编号（符合港铁荃湾线实际及 data.py 规则）
                let upPlatNum = "2";
                let downPlatNum = "1";
                
                if (staCode === "CEN") {
                    upPlatNum = "1";
                    downPlatNum = "2";
                } else if (staCode === "TSW") {
                    upPlatNum = "2";
                    downPlatNum = "1";
                } else {
                    // 中间车站：上行一般为 2 站台，下行一般为 1 站台（或依据实际配置）
                    upPlatNum = "2";
                    downPlatNum = "1";
                }

                // 判断该月台是否停靠列车
                const upIsArrived = arrivedPlats.includes(upPlatNum) || (staCode !== "CEN" && staInfo.UP);
                const downIsArrived = arrivedPlats.includes(downPlatNum) || (staCode !== "CEN" && staInfo.DOWN);

                // 样式判定
                const upBadgeClass = upIsArrived 
                    ? 'bg-red-600 text-white shadow-lg shadow-red-900/50 border-red-500 animate-pulse' 
                    : 'bg-gray-800 text-gray-400 border-gray-700/60';
                
                const downBadgeClass = downIsArrived 
                    ? 'bg-red-600 text-white shadow-lg shadow-red-900/50 border-red-500 animate-pulse' 
                    : 'bg-gray-800 text-gray-400 border-gray-700/60';

                // 1. 渲染车站行：格式形如 [月台1]  CEN  [月台2]
                html += `
                    <div class="flex items-center justify-between bg-gray-950/70 hover:bg-gray-950/95 transition px-6 py-3.5 rounded-xl border border-gray-800/80">
                        <!-- 上行月台 (UP) -->
                        <div class="flex items-center gap-3 w-1/3">
                            <div class="px-3.5 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center gap-2 ${upBadgeClass}">
                                <span class="text-[10px] opacity-70">月台</span>
                                <span class="text-sm">${upPlatNum}</span>
                                <span class="text-[10px]">${upIsArrived ? '● 停靠' : '○'}</span>
                            </div>
                        </div>

                        <!-- 车站代码 -->
                        <div class="w-1/3 text-center">
                            <span class="font-mono font-black text-xl text-amber-400 tracking-wider">${staCode}</span>
                        </div>

                        <!-- 下行月台 (DOWN) -->
                        <div class="flex items-center justify-end gap-3 w-1/3">
                            <div class="px-3.5 py-1.5 rounded-lg text-xs font-mono font-bold border transition-all flex items-center gap-2 ${downBadgeClass}">
                                <span class="text-[10px]">${downIsArrived ? '● 停靠' : '○'}</span>
                                <span class="text-sm">${downPlatNum}</span>
                                <span class="text-[10px] opacity-70">月台</span>
                            </div>
                        </div>
                    </div>
                `;

                // 2. 渲染两站之间的区段轨道（带有立体垂直轨道线）
                if (index < stations.length - 1) {
                    const nextCode = stations[index + 1];
                    const downSegKey = `TWL-DOWN-${staCode}->${nextCode}`;
                    const upSegKey = `TWL-UP-${nextCode}->${staCode}`;

                    const downHasTrain = segmentQueues[downSegKey] && segmentQueues[downSegKey].length > 0;
                    const upHasTrain = segmentQueues[upSegKey] && segmentQueues[upSegKey].length > 0;

                    const upRailColor = upHasTrain ? 'bg-red-500 shadow-md shadow-red-900/50' : 'bg-gray-800';
                    const downRailColor = (nextCode === 'TSW') ? 'bg-blue-600/40' : (downHasTrain ? 'bg-red-500 shadow-md shadow-red-900/50' : 'bg-gray-800');

                    html += `
                        <div class="flex justify-between items-center px-10 py-1">
                            <!-- 上行轨道线 -->
                            <div class="flex items-center gap-2">
                                <div class="w-1.5 h-7 rounded-full transition-all duration-300 ${upRailColor}"></div>
                                <span class="text-[10px] font-mono text-gray-500">${upHasTrain ? '▲ 在途' : '│'}</span>
                            </div>

                            <!-- 中间虚线隔断 -->
                            <div class="flex-1 border-t border-dashed border-gray-800 mx-6"></div>

                            <!-- 下行轨道线 -->
                            <div class="flex items-center gap-2 flex-row-reverse">
                                <div class="w-1.5 h-7 rounded-full transition-all duration-300 ${downRailColor}"></div>
                                <span class="text-[10px] font-mono text-gray-500">${downHasTrain ? '▼ 在途' : '│'}</span>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        fetchTrainData();
        setInterval(fetchTrainData, 5000);
    </script>
</body>
</html>
